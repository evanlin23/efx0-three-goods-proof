name: verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan (the toolchain pinned in lean/lean-toolchain is fetched on first use)
        run: |
          [ -x "$HOME/.elan/bin/elan" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit (core Lean only, no sorry, standard axioms only, fresh-kernel replay)
        run: lean/check.sh
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every example and number of the paper, the exhaustive checks and DE on random instances
        run: python paper/k3-simple/examples/check_examples.py
  k4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Four relevant goods (k4/de4) - tests of Theorem 1, and the barrier certificates re-checked
        run: |
          python k4/de4/test_de4.py
          python k4/de4/check_barrier.py
